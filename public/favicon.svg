<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="plGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0f172a" />
  
  <!-- Outer subtle ring -->
  <rect x="5" y="5" width="118" height="118" rx="27" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.4" />

  <!-- Loop & Pile Knot Emblem -->
  <g transform="translate(16, 16)" filter="url(#shadow)">
    <!-- Primary Knot Loop -->
    <path d="M 48,16 C 30,16 16,30 16,48 C 16,66 30,80 48,80 C 66,80 80,66 80,48 C 80,30 66,16 48,16 Z" 
          fill="none" 
          stroke="url(#plGradient)" 
          stroke-width="12" 
          stroke-linecap="round" />
    
    <!-- Inner Stylized Infinity Crossing / Thread Loop -->
    <path d="M 28,48 C 28,38 38,28 48,28 C 58,28 68,38 68,48 C 68,58 58,68 48,68 C 38,68 28,58 28,48 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4" 
          stroke-dasharray="6 4" 
          opacity="0.85" />

    <!-- Center Accent Dot -->
    <circle cx="48" cy="48" r="8" fill="#10B981" />
    <circle cx="48" cy="48" r="3" fill="#ffffff" />
  </g>
</svg>
