<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%">
  <defs>
    <linearGradient id="logoEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Knot Emblem -->
  <g transform="translate(6, 6)">
    <rect width="48" height="48" rx="12" fill="#0f172a" />
    <path d="M 24,12 C 16,12 10,18 10,24 C 10,30 16,36 24,36 C 32,36 38,30 38,24 C 38,18 32,12 24,12 Z" 
          fill="none" 
          stroke="url(#logoEmeraldGrad)" 
          stroke-width="5" />
    <circle cx="24" cy="24" r="4" fill="#10B981" />
  </g>

  <!-- Typography: PILE & LOOP -->
  <text x="66" y="32" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="20" fill="#0f172a" letter-spacing="-0.5">
    PILE <tspan fill="#10B981">&amp;</tspan> LOOP
  </text>
  <text x="66" y="47" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748b" letter-spacing="1.5">
    HR OPERATING SYSTEM
  </text>
</svg>
